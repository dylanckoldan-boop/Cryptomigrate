# Crypto gate: blocks pull requests that introduce DES/3DES (workplan Phase 4 exit criterion P4-CI)
# and publishes the cryptographic inventory to GitHub code scanning (SARIF) and as a CBOM artifact.
name: Crypto gate (DES/3DES)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"          # weekly re-scan picks up new rules and forgotten code paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crypto-inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write      # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install cryptomigrate
        run: pip install "cryptomigrate @ git+https://github.com/dylanckoldan-boop/cryptomigrate@v1.1.1"
      - name: Discover DES/3DES (fails on high or critical)
        # CI has no database or internal-network access: data profiling and TLS probes run in the migration pipeline.
        run: cryptomigrate discover --no-data --no-tls --out crypto-artifacts --fail-on high
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true   # private repos need GitHub Code Security; the gate still enforces via exit code
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: crypto-artifacts/cryptomigrate.sarif
          category: cryptomigrate
      - name: Upload inventory and CBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crypto-inventory
          path: crypto-artifacts/
      - name: Job summary
        if: always()
        run: cat crypto-artifacts/inventory.md >> "$GITHUB_STEP_SUMMARY"
