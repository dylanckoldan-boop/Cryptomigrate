# Release: build, generate an SBOM, attest build provenance (SLSA), and publish to GitHub Releases.
# Consumers can verify with: gh attestation verify dist/<file> --repo <owner>/<repo>
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # OIDC token for signing the provenance
      attestations: write    # store the attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build cyclonedx-bom
      - name: Build sdist and wheel
        run: python -m build
      - name: Software bill of materials (CycloneDX)
        run: |
          python -m pip install dist/*.whl
          cyclonedx-py environment --output-format JSON --output-file dist/sbom.cdx.json
      - name: Test the built wheel before releasing it
        run: cryptomigrate selftest
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes
